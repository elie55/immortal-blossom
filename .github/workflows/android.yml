# The Android app: the web game wrapped by Capacitor, built into a debug APK on every push to main (or core-loop-alpha).
# The APK is attached to the run and to the "android-alpha" pre-release, whose page a phone can open to install it.
name: Android APK

on:
  push:
    branches: [main, core-loop-alpha]
    paths: ['game/**', 'data/**', 'tools/build_game.py', 'tools/offline_fonts.py', 'tools/android_setup.py', 'tools/android-debug.keystore',
            'android-res/**', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:          # one build at a time: the same commit pushed to both branches builds once
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the web game, with its fonts bundled
        run: |
          python3 tools/build_game.py
          python3 tools/offline_fonts.py

      - name: Make the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 tools/android_setup.py
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          # one debug key for every build, so a new APK installs over the last one and keeps the saves
          mkdir -p ~/.android && cp ../tools/android-debug.keystore ~/.android/debug.keystore
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk immortal-blossoms-alpha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: immortal-blossoms-alpha-apk
          path: immortal-blossoms-alpha.apk

      - name: Publish it on the android-alpha pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-alpha >/dev/null 2>&1; then
            gh release create android-alpha --prerelease --target "$GITHUB_SHA" --title "Android alpha (latest build)" \
              --notes "Debug build of the core loop alpha, for testing on a phone. Download the APK on the phone and open it (allow your browser to install apps). Each new build replaces it."
          fi
          gh release upload android-alpha immortal-blossoms-alpha.apk --clobber
          gh release edit android-alpha --notes "Debug build of the core loop alpha from ${GITHUB_SHA::7} (run ${{ github.run_number }}), for testing on a phone. Download the APK on the phone and open it (allow your browser to install apps). Each new build replaces it."
