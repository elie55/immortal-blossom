<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Immortal Blossoms Card Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Oswald:wght@500;600;700&family=Noto+Serif+SC:wght@600;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #e8c77d; --gold2: #b8955a; --ink: #0b1018; --panel: rgba(9, 13, 22, .84); --line: rgba(232, 199, 125, .42);
  --txt: #f3ead6; --mut: #a9b6c6; --hero: #6fb8ff; --enemy: #ff5f6f; --spd: 1;
  --x0: 361px; --rowW: 878px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; color: var(--txt); font-family: 'Cormorant Garamond', Georgia, serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font-family: inherit; color: inherit; cursor: pointer; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #070a11; }

/* ---------------- background & board frame ---------------- */
#bg { position: absolute; inset: 0; z-index: 0; }
.bg-img { position: absolute; inset: -20px; background: url(assets/bg/arena.webp) center 62% / cover; filter: saturate(.85) blur(1.5px); }
.bg-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 52%, rgba(6, 9, 16, .45), rgba(4, 6, 11, .9) 72%), linear-gradient(rgba(5, 8, 14, .55), rgba(5, 8, 14, .35) 45%, rgba(5, 8, 14, .7)); }
.bg-table { position: absolute; left: calc(var(--x0) - 22px); width: calc(var(--rowW) + 44px); top: 10px; bottom: 10px; border-radius: 22px;
  background: linear-gradient(rgba(10, 14, 24, .55), rgba(8, 11, 19, .35) 46%, rgba(8, 11, 19, .35) 54%, rgba(10, 14, 24, .55));
  border: 1px solid rgba(232, 199, 125, .28); box-shadow: inset 0 0 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .5); }
.bg-table::before, .bg-table::after { content: ''; position: absolute; left: 30px; right: 30px; height: 1px; top: 50%; background: linear-gradient(90deg, transparent, rgba(232, 199, 125, .5), transparent); }
.bg-table::after { top: calc(50% + 4px); opacity: .4; }

#world { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#fxb, #fxf { position: absolute; left: 0; top: 0; pointer-events: none; }
#fxb { z-index: 1; } #board { position: absolute; inset: 0; z-index: 2; pointer-events: none; } #fxf { z-index: 3; }

/* ---------------- cards ---------------- */
.card { position: absolute; perspective: 900px; pointer-events: auto; cursor: default; }
.c-body { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.c-face, .c-back { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.c-back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 46%, rgba(232, 199, 125, .3), transparent 42%), repeating-conic-gradient(from 0deg at 50% 46%, rgba(232, 199, 125, .07) 0 6deg, transparent 6deg 12deg), linear-gradient(160deg, #18233a, #0a0f1a 60%, #160f22); border: 2px solid rgba(232, 199, 125, .85); box-shadow: inset 0 0 0 6px rgba(10, 14, 24, .9), inset 0 0 0 7px rgba(232, 199, 125, .5); display: grid; place-items: center; }
.c-back span { font: 900 64px 'Noto Serif SC', serif; color: #e8c77d; text-shadow: 0 0 18px rgba(232, 199, 125, .8); }
.card.show-back .c-face { visibility: hidden; }
.c-art { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #0b0f18; }
.c-art img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; transform-origin: 50% 28%; animation: breathe 7s ease-in-out infinite alternate; display: block; }
.wide .c-art img { object-position: center 26%; }
@keyframes breathe { from { transform: scale(1.03) translateY(0); } to { transform: scale(1.08) translateY(-1.4%); } }
.c-shade { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(180deg, rgba(5, 8, 14, .78) 0%, rgba(5, 8, 14, .1) 17%, rgba(5, 8, 14, 0) 46%, rgba(5, 8, 14, .78) 72%, rgba(5, 8, 14, .97) 100%); }
/* Decorative layers never take clicks: once a card tilts in 3D, the browser can otherwise hit the art above the technique buttons. */
.c-art, .c-art img, .c-shade, .c-back { pointer-events: none; }
.c-foil { position: absolute; inset: 0; border-radius: 14px; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .2) 47%, rgba(255, 236, 190, .1) 52%, transparent 60%); background-size: 280% 100%; animation: foil 8s linear infinite; }
@keyframes foil { 0% { background-position: 170% 0; } 35%, 100% { background-position: -70% 0; } }
.c-frame { position: absolute; inset: 0; border-radius: 14px; border: 2px solid rgba(232, 199, 125, .9); pointer-events: none; transition: box-shadow .2s, border-color .2s;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .7), inset 0 0 20px rgba(0, 0, 0, .55), 0 8px 22px rgba(0, 0, 0, .6); }
.c-frame::before { content: ''; position: absolute; inset: 5px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--ph) 55%, transparent); }
.c-frame::after { content: ''; position: absolute; inset: -3px; border-radius: 16px; background:
  radial-gradient(circle at 0 0, #f6e2a6 0 4px, transparent 5px), radial-gradient(circle at 100% 0, #f6e2a6 0 4px, transparent 5px),
  radial-gradient(circle at 0 100%, #f6e2a6 0 4px, transparent 5px), radial-gradient(circle at 100% 100%, #f6e2a6 0 4px, transparent 5px); }
.enemy .c-frame { border-color: rgba(190, 120, 210, .85); }
.enemy .c-frame::after { background: radial-gradient(circle at 0 0, #d7a8ff 0 4px, transparent 5px), radial-gradient(circle at 100% 0, #d7a8ff 0 4px, transparent 5px), radial-gradient(circle at 0 100%, #d7a8ff 0 4px, transparent 5px), radial-gradient(circle at 100% 100%, #d7a8ff 0 4px, transparent 5px); }
.boss .c-frame { border-width: 3px; border-color: #c9a0ff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .7), inset 0 0 26px rgba(40, 0, 70, .6), 0 0 26px rgba(160, 90, 255, .35), 0 8px 22px rgba(0, 0, 0, .6); }

.c-head { position: absolute; left: 7px; right: 7px; top: 7px; height: 32px; display: flex; align-items: center; gap: 6px; }
.c-phase { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 900 17px 'Noto Serif SC', serif; color: #0f131b;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .7), transparent 55%), var(--ph); border: 2px solid #f3dc9c; box-shadow: 0 0 10px color-mix(in srgb, var(--ph) 80%, transparent), 0 2px 4px #000; }
.c-name { flex: 1; min-width: 0; font: 700 14.5px Cinzel, serif; color: #fff; text-align: center; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000, 0 0 10px #000; }
.wide .c-name { font-size: 17px; }
.c-lvl { width: 30px; height: 33px; flex: none; display: grid; place-items: center; font: 700 13px Oswald, sans-serif; color: #2a1a06; clip-path: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%); background: linear-gradient(#f8e6ad, #b8893e); }
.enemy .c-lvl { background: linear-gradient(#e7c8ff, #8a5cc0); color: #1a0828; }

.c-status { position: absolute; left: 9px; right: 30px; top: 45px; display: flex; flex-wrap: wrap; gap: 4px; }
.c-status i { font-style: normal; width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center; position: relative; font: 700 13px 'Noto Serif SC', serif; color: #fff;
  background: color-mix(in srgb, var(--sc) 55%, #05070c); border: 1.5px solid var(--sc); box-shadow: 0 0 7px color-mix(in srgb, var(--sc) 55%, transparent), 0 2px 3px #000; animation: pop .3s ease-out; }
.c-status i.debuff { border-radius: 50%; }
.c-status em { position: absolute; right: -5px; bottom: -6px; font: 700 10px Oswald, sans-serif; font-style: normal; background: #070a12; color: #ffe9a8; padding: 0 3px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .25); }
@keyframes pop { from { transform: scale(1.8); opacity: 0; } }
.c-slots { position: absolute; right: -10px; top: 50px; display: flex; flex-direction: column; gap: 6px; }
.c-slots i { width: 23px; height: 23px; border-radius: 50%; background: #0a0e17; border: 2px solid rgba(232, 199, 125, .45); display: grid; place-items: center; font: 700 12px 'Noto Serif SC', serif; font-style: normal; color: #fff; box-shadow: 0 2px 4px #000; }
.c-slots i.r1 { border-color: #8fe6b8; } .c-slots i.r2 { border-color: #c29aff; box-shadow: 0 0 9px #a070ff; } .c-slots i.r3 { border-color: #ffd27a; box-shadow: 0 0 11px #ffc24a; }

.c-techs { position: absolute; left: 6px; right: 6px; bottom: 38px; display: flex; justify-content: center; gap: 9px; }
.boss .c-techs { bottom: 52px; gap: 14px; }
.tech { width: 54px; height: 54px; border-radius: 50%; border: 0; padding: 0; position: relative; background: #0a0e17; transition: transform .15s, box-shadow .2s; box-shadow: 0 3px 6px rgba(0, 0, 0, .7); }
.tech img, .tech .glyph { position: absolute; left: 5px; top: 5px; width: 44px; height: 44px; border-radius: 50%; object-fit: cover; transition: filter .25s; }
.tech .glyph { display: grid; place-items: center; font: 900 21px 'Noto Serif SC', serif; color: var(--ph); background: radial-gradient(circle at 40% 35%, #26304a, #0a0e17 75%); }
.tech svg { position: absolute; inset: 0; width: 54px; height: 54px; transform: rotate(-90deg); pointer-events: none; }
.tech .trk { fill: none; stroke: rgba(0, 0, 0, .65); stroke-width: 5; }
.tech .arc { fill: none; stroke: var(--ph); stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray .45s; }
.tech b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 24px Oswald, sans-serif; color: #fff; text-shadow: 0 2px 6px #000, 0 0 3px #000; pointer-events: none; }
.tech:not(.ready) img, .tech:not(.ready) .glyph { filter: grayscale(.85) brightness(.38); }
.tech.ready { box-shadow: 0 0 0 2px #f3dc9c, 0 0 14px color-mix(in srgb, var(--ph) 80%, transparent), 0 3px 6px rgba(0, 0, 0, .7); }
.tech.ready .arc { stroke: #fff3c4; }
.hero.can-act .tech.ready { animation: techPulse 1.7s ease-in-out infinite; cursor: pointer; }
@keyframes techPulse { 50% { box-shadow: 0 0 0 2px #fff6d6, 0 0 22px color-mix(in srgb, var(--ph) 100%, transparent), 0 3px 6px rgba(0, 0, 0, .7); } }
.tech.ult::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px dashed rgba(255, 214, 120, .65); animation: spin 9s linear infinite; pointer-events: none; }
.tech.ult:not(.ready)::after { opacity: .35; animation: none; }
.tech.sel { transform: translateY(-9px) scale(1.14); box-shadow: 0 0 0 3px #fff6d6, 0 0 26px #ffe08a !important; animation: none !important; }
.skip .tech { opacity: .55; }
@keyframes spin { to { transform: rotate(360deg); } }

.c-qi { position: absolute; left: 12px; right: 12px; bottom: 36px; height: 9px; display: flex; gap: 4px; }
.c-qi i { flex: 1; background: rgba(255, 255, 255, .1); clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); transition: background .2s; }
.c-qi i.on { background: linear-gradient(#fff6cf, #e8b84a); box-shadow: 0 0 8px #ffd27a; }
.c-tele { position: absolute; right: 10px; top: 46px; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 22px; background: rgba(12, 6, 22, .86); border: 1px solid #a77be0; box-shadow: 0 0 12px rgba(150, 90, 230, .45); }
.c-tele .g { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, #4a2a72, #1a0d2c); color: #e3c8ff; font: 900 16px 'Noto Serif SC', serif; }
.c-tele small { display: block; font: 600 11px Cinzel, serif; color: #cbb3ea; letter-spacing: .04em; }
.c-tele b { display: block; font: 700 15px Oswald, sans-serif; color: #fff; letter-spacing: .04em; }
.c-tele.hot { border-color: #ff6a7a; box-shadow: 0 0 16px rgba(255, 70, 90, .6); animation: hot 1s ease-in-out infinite; }
.c-tele.hot b { color: #ffb0b8; }
@keyframes hot { 50% { box-shadow: 0 0 26px rgba(255, 70, 90, .9); } }

.c-hp { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 21px; border-radius: 11px; background: rgba(0, 0, 0, .78); border: 1px solid rgba(232, 199, 125, .6); overflow: hidden; }
.c-hp i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; }
.c-hp .lag { background: rgba(255, 255, 255, .72); }
.c-hp .fill { background: linear-gradient(#b1ff9c, #2fae4a 70%, #22863a); }
.enemy .c-hp .fill { background: linear-gradient(#ffa08f, #c4242a 70%, #96141c); }
.c-hp .bar-sh { top: auto; height: 7px; background: linear-gradient(#fffbe0, #ffd27a); box-shadow: 0 0 6px #ffd27a; }
.c-hp span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px Oswald, sans-serif; color: #fff; letter-spacing: .03em; text-shadow: 0 1px 2px #000, 0 0 4px #000; }

.c-adv { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); display: none; white-space: nowrap; padding: 5px 12px; border-radius: 16px; font: 700 13px Cinzel, serif; letter-spacing: .03em; box-shadow: 0 4px 10px rgba(0, 0, 0, .6); pointer-events: none; }
.c-adv b { margin-right: 6px; }
.c-adv.good { display: block; background: rgba(16, 70, 36, .92); color: #c4ffcb; border: 1px solid #6fe08a; }
.c-adv.bad { display: block; background: rgba(86, 18, 22, .92); color: #ffc4c4; border: 1px solid #e07070; }
.c-flash { position: absolute; inset: 0; border-radius: 14px; background: #fff; opacity: 0; mix-blend-mode: screen; pointer-events: none; }
.c-crack { position: absolute; inset: 0; display: none; place-items: center; align-content: center; pointer-events: none; }
.c-crack span { font: 900 72px 'Noto Serif SC', serif; color: rgba(200, 40, 50, .85); text-shadow: 0 0 12px #000; transform: rotate(-12deg); }
.c-crack b { font: 700 16px Cinzel, serif; letter-spacing: .3em; color: #e9c3c3; text-transform: uppercase; }

/* card states */
.card.can-act .c-frame { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .7), inset 0 0 20px rgba(0, 0, 0, .55), 0 0 18px color-mix(in srgb, var(--ph) 55%, transparent), 0 8px 22px rgba(0, 0, 0, .6); }
.card.selected .c-frame { border-color: #fff3c4; box-shadow: 0 0 0 2px var(--ph), 0 0 30px var(--ph), 0 8px 22px rgba(0, 0, 0, .6); }
.card.targetable { cursor: pointer; }
.card.targetable .c-frame { border-color: #fff3c4; animation: tgPulse 1.05s ease-in-out infinite; }
@keyframes tgPulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(255, 243, 196, .9), 0 0 18px rgba(255, 236, 170, .7); } 50% { box-shadow: 0 0 0 3px #fff, 0 0 36px rgba(255, 236, 170, 1); } }
.card.dimmed .c-face { filter: brightness(.5) saturate(.6); transition: filter .2s; }
.card.skip:not(.dead) .c-art img { filter: saturate(.35) brightness(.85) sepia(.2) hue-rotate(160deg); }
.card.skip:not(.dead) .c-face::after { content: 'SKIPS TURN'; position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); font: 700 13px Cinzel, serif; letter-spacing: .12em; color: #d7f0ff; background: rgba(14, 40, 70, .85); border: 1px solid #7cc6ff; padding: 4px 10px; border-radius: 12px; }
.hero.dead .c-face { filter: grayscale(1) brightness(.42); }
.hero.dead .c-crack { display: grid; }
.hero.dead .c-techs, .hero.dead .c-status { visibility: hidden; }
.card.dying .c-face { animation: dying .7s ease-out forwards; }
.enemy.dying .c-face { animation: edie .72s ease-in forwards; }
@keyframes dying { 0% { filter: brightness(2.4); } 100% { filter: grayscale(1) brightness(.42); } }
@keyframes edie { 0% { filter: brightness(2.6); opacity: 1; } 60% { opacity: .8; } 100% { filter: grayscale(1) brightness(.2) blur(4px); opacity: 0; } }
.card.gone { visibility: hidden; pointer-events: none; }
.card.acting { z-index: 5; }

/* ---------------- side panels ---------------- */
#lp, #rp { position: absolute; top: 10px; bottom: 10px; width: calc(var(--x0) - 40px); z-index: 2; display: flex; flex-direction: column; }
#lp { left: 12px; justify-content: space-between; }
#rp { right: 12px; gap: 10px; align-items: stretch; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
.side-enemy { height: 313px; border-color: rgba(190, 120, 210, .45); display: flex; flex-direction: column; gap: 12px; }
.side-hero { height: 313px; display: flex; flex-direction: column; gap: 10px; }
.side-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 700 15px Cinzel, serif; color: #e3c8ff; letter-spacing: .05em; }
.side-title em { font: 600 12px Oswald, sans-serif; font-style: normal; color: #2a1640; background: #cba5f5; padding: 2px 8px; border-radius: 10px; letter-spacing: .06em; white-space: nowrap; }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px 6px; }
.orb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: .5; transition: opacity .3s; }
.orb.on { opacity: 1; }
.orb i { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 900 19px 'Noto Serif SC', serif; font-style: normal; color: #0f131b;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .75), transparent 55%), var(--pc); border: 2px solid rgba(255, 255, 255, .35); box-shadow: 0 0 0 1px #000, 0 0 12px color-mix(in srgb, var(--pc) 50%, transparent); }
.orb.on i { box-shadow: 0 0 0 1px #000, 0 0 18px var(--pc); border-color: #fff3c4; }
.orb b { position: absolute; top: -4px; right: 0; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 10px; background: #070a12; border: 1px solid var(--pc); font: 700 13px Oswald, sans-serif; color: #fff; display: grid; place-items: center; }
.orb small { font: 600 12px Oswald, sans-serif; color: var(--pc); letter-spacing: .03em; }
.orb.bump i { animation: orbBump .45s ease-out; }
@keyframes orbBump { 30% { transform: scale(1.35); filter: brightness(1.6); } }
.side-enemy .orb i { width: 34px; height: 34px; font-size: 15px; }
.qi-box { position: relative; display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-radius: 12px; background: linear-gradient(90deg, rgba(232, 199, 125, .16), transparent); border: 1px solid rgba(232, 199, 125, .3); }
.qi-ic { width: 50px; height: 50px; color: #f3d48a; filter: drop-shadow(0 0 8px rgba(243, 212, 138, .7)); flex: none; }
.qi-ic svg { width: 100%; height: 100%; }
.qi-box b { display: block; font: 700 34px/1 Oswald, sans-serif; color: #fff6d6; text-shadow: 0 0 12px rgba(232, 199, 125, .7); }
.qi-box small { font: 600 13px Cinzel, serif; color: var(--gold); letter-spacing: .06em; }
.qi-box.bump { animation: qiBump .4s ease-out; }
@keyframes qiBump { 40% { transform: scale(1.06); background-color: rgba(232, 199, 125, .25); } }
#qi-pop { position: absolute; left: 116px; top: 2px; font: 700 18px Oswald, sans-serif; font-style: normal; opacity: 0; pointer-events: none; }
#qi-pop.up { color: #9dff8a; } #qi-pop.down { color: #ff9aa6; }
#qi-pop.go { animation: qiPop 1s ease-out; }
@keyframes qiPop { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px); } }
.pool-title { font: 700 13px Cinzel, serif; color: var(--gold); letter-spacing: .06em; display: flex; justify-content: space-between; align-items: baseline; }
.pool-title small { font: italic 500 13px 'Cormorant Garamond', serif; color: var(--mut); letter-spacing: 0; }

.ctls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.ctl { height: 42px; min-width: 42px; padding: 0 12px; border-radius: 21px; border: 1px solid var(--line); background: var(--panel); font: 700 14px Cinzel, serif; letter-spacing: .08em; color: var(--gold); display: grid; place-items: center; }
.ctl.on { background: linear-gradient(#f0d58e, #c39a4c); color: #2a1d08; box-shadow: 0 0 14px rgba(240, 213, 142, .6); }
.ctl.off { opacity: .45; }
.ctl svg { width: 19px; height: 19px; fill: currentColor; }
.seal { align-self: center; width: 118px; height: 118px; border-radius: 50%; display: grid; place-items: center; align-content: center; text-align: center; position: relative; margin: 2px 0;
  background: radial-gradient(circle at 50% 40%, #233150, #0b111d 70%); border: 2px solid var(--gold); box-shadow: 0 0 0 5px rgba(10, 14, 24, .85), 0 0 0 6px rgba(232, 199, 125, .4), 0 0 24px rgba(232, 199, 125, .3); }
.seal small { font: 600 12px Cinzel, serif; color: var(--mut); letter-spacing: .18em; text-transform: uppercase; }

/* ---------------- ultimate cut-in ---------------- */
#cutin { position: absolute; inset: 0; z-index: 8; pointer-events: none; display: none; --el: #fff; overflow: hidden; }
#cutin.show { display: block; }
.ci-wash { position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 45%, color-mix(in srgb, var(--el) 35%, transparent), rgba(0, 0, 0, .74) 70%); animation: ciFade calc(.25s / var(--spd)) ease-out both; }
.ci-lines { position: absolute; inset: -20%; background: repeating-linear-gradient(-7deg, transparent 0 34px, rgba(255, 255, 255, .07) 34px 36px, transparent 36px 90px, color-mix(in srgb, var(--el) 30%, transparent) 90px 92px); animation: ciLines calc(.5s / var(--spd)) linear infinite, ciFade calc(.25s / var(--spd)) ease-out both; mix-blend-mode: screen; }

.ci-back { top: 18%; height: 56%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--el) 70%, #000) 30%, var(--el) 60%, transparent); opacity: .85; animation: ciIn calc(.42s / var(--spd)) cubic-bezier(.16, 1, .3, 1) both; }

.ci-art { position: absolute; inset: -30% -6%; background-size: cover; background-position: center 30%; transform: skewY(7deg) translateX(4%) scale(1.08); animation: ciPan calc(1.7s / var(--spd)) linear both; }

.ci-shine { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .55) 48%, transparent 60%); transform: translateX(-120%); animation: ciShine calc(.7s / var(--spd)) calc(.3s / var(--spd)) ease-out both; mix-blend-mode: screen; }
.ci-text { position: absolute; left: 6%; top: 61%; opacity: 0; transform: translateX(-12%); animation: ciText calc(.4s / var(--spd)) calc(.22s / var(--spd)) cubic-bezier(.16, 1, .3, 1) forwards; text-shadow: 0 0 22px var(--el), 0 3px 8px #000; }

.ci-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#cutin.out .ci-main, #cutin.out .ci-back { animation: ciOut calc(.26s / var(--spd)) cubic-bezier(.7, 0, .84, 0) forwards; }
#cutin.out .ci-text, #cutin.out .ci-wash, #cutin.out .ci-lines { opacity: 0; transition: opacity calc(.2s / var(--spd)); }
#cutin.out .ci-flash { animation: ciFlash calc(.3s / var(--spd)) ease-out; }
@keyframes ciIn { to { transform: skewY(-7deg) translateX(0); } }
@keyframes ciOut { from { transform: skewY(-7deg) translateX(0); } to { transform: skewY(-7deg) translateX(-118%); } }
@keyframes ciPan { from { transform: skewY(7deg) translateX(6%) scale(1.1); } to { transform: skewY(7deg) translateX(-4%) scale(1.04); } }
@keyframes ciShine { to { transform: translateX(120%); } }

// ===== board.js =====
// Board: card DOM, slot layout, and a per-card motion model (offset tweens + shake + knockback + flash)
// driven by the game clock, so impact frames and the x2 speed toggle apply to cards as well as VFX.

const CARD = { w: 206, h: 309, gap: 18 };
const geo = { W: 1600, H: 720, x0: 0, enemyY: 26, heroY: 385 };
const tweens = [];
function clearTweens() { tweens.length = 0; }

function layoutBoard(W, H) {
  geo.W = W; geo.H = H;
  const rowW = 4 * CARD.w + 3 * CARD.gap;
  geo.x0 = Math.round((W - rowW) / 2);
  geo.enemyY = 24; geo.heroY = H - 24 - CARD.h;
}
/** Rect of a unit's card in stage coordinates. Enemy rows are centred whatever their size. */
function slotRect(u) {
  const step = CARD.w + CARD.gap;
  if (u.side === 'hero') return { x: geo.x0 + u.slot * step, y: geo.heroY, w: CARD.w, h: CARD.h };
  const x = geo.x0 + (u.slotX ?? u.slot) * step;
  return { x, y: geo.enemyY, w: u.wide ? CARD.w * 2 + CARD.gap : CARD.w, h: CARD.h };
}
function center(u, fy = 0.5) {
  const r = slotRect(u), m = u.m || {};
  return { x: r.x + r.w / 2 + (m.x || 0), y: r.y + r.h * fy + (m.y || 0) };
}

// ---------------- card DOM ----------------
const techIcon = (t) => t.icon.startsWith('g:')
  ? `<span class="glyph">${t.icon.slice(2)}</span>`
  : `<img src="assets/ui/${t.icon}.webp" alt="" draggable="false">`;

function createCard(u, parent) {

      <div class="c-face">

        <div class="c-foil" style="animation-delay:${-rand(0, 8).toFixed(2)}s"></div>
        <div class="c-frame"></div>

          <div class="c-phase" title="${ph.name}">${ph.glyph}</div>

        </div>
        <div class="c-status"></div>

        ${u.boss ? '<div class="c-tele"></div>' : ''}
        <div class="c-techs">${u.techs.map((t, i) => `
          <button class="tech${t.ult ? ' ult' : ''}" data-i="${i}" aria-label="${t.name}">
            ${techIcon(t)}
            <svg viewBox="0 0 60 60"><circle class="trk" cx="30" cy="30" r="27"/><circle class="arc" cx="30" cy="30" r="27"/></svg>
            <b></b>

        </div>
        ${u.qiShield ? `<div class="c-qi">${'<i></i>'.repeat(u.qiShield.max)}</div>` : ''}
        <div class="c-hp"><i class="lag"></i><i class="fill"></i><i class="bar-sh"></i><span></span></div>
        <div class="c-adv"></div>

  parent.appendChild(el);

  u.hpShown = u.hp; u.hpLag = u.hp;

  return el;
}

function placeCard(u) {

  Object.assign(u.el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
}

const CIRC = 2 * Math.PI * 27;
/** Sync a card's DOM with its unit state (HP text, techniques, statuses, shields, slots). */
function refreshCard(u, first = false) {
  const el = u.el; if (!el) return;
  el.querySelector('.c-hp span').textContent = `${Math.max(0, Math.ceil(u.hp)).toLocaleString('en-US')}${u.barrier > 0 ? ` +${Math.ceil(u.barrier).toLocaleString('en-US')}` : ''}`;
  el.querySelectorAll('.tech').forEach((b, i) => {
    const t = u.techs[i], ready = t.cur <= 0;
    b.classList.toggle('ready', ready);
    b.classList.toggle('blocked', !!t.blocked);
    b.querySelector('b').textContent = ready ? '' : t.cur;
    const frac = ready ? 1 : 1 - t.cur / t.cd;
    const arc = b.querySelector('.arc');
    arc.style.strokeDasharray = `${CIRC * frac} ${CIRC}`;
  });
  // statuses
  const st = el.querySelector('.c-status');
  st.innerHTML = u.status.map(s => { const d = STATUS[s.id]; return `<i class="${d.debuff ? 'debuff' : 'buff'}" style="--sc:${d.color}" title="${d.name}">${d.glyph}${s.turns > 0 && s.id !== 'shield' ? `<em>${s.turns}</em>` : ''}</i>`; }).join('');
  if (u.qiShield) el.querySelectorAll('.c-qi i').forEach((s, i) => s.classList.toggle('on', i < u.qiShield.cur));
  if (u.side === 'hero') el.querySelectorAll('.c-slots i').forEach((s, i) => {
    const a = u.attached[i]; s.className = a ? `r${a.rarity}` : ''; s.textContent = a ? a.glyph : ''; s.title = a ? a.name : 'Empty encounter slot';
  });
  if (u.boss) {
    const t = u.techs.find(x => x.tele), tl = el.querySelector('.c-tele');
    const when = t.cur <= 0 ? (geo.side === 'enemy' ? 'NOW' : 'NEXT TURN') : (t.cur === 1 ? 'NEXT TURN' : `in ${t.cur} turns`);
    tl.innerHTML = `<span class="g">${t.icon.slice(2)}</span><span><small>${t.name}</small><b>${when}</b></span>`;
    tl.classList.toggle('hot', t.cur <= 1);
  }
  el.classList.toggle('dead', !u.alive);
  el.classList.toggle('skip', !!u.skip && u.alive);
  if (first) { u.hpShown = u.hp; u.hpLag = u.hp; }
}

// ---------------- motion ----------------
/** Tween numeric fields of a card's motion state. Resolves on the game clock. */
function tweenCard(u, to, dur, e = ease.outCubic) {
  const m = u.m, from = {};
  for (const k in to) from[k] = m[k];
  return new Promise(res => tweens.push({ m, from, to, t0: clock.t, dur: Math.max(1, dur), e, res }));
}
function hitCard(u, { power = 1, dir = -1, color = '#ffffff' } = {}) {
  const m = u.m; if (!m) return;
  m.flash = Math.min(1, 0.55 + 0.35 * power); m.flashColor = color;
  m.shake = Math.max(m.shake, 6 * power);
  m.ky += dir * 16 * power; m.kx += rand(-6, 6) * power;
  m.kr = (m.kr || 0) + rand(-3, 3) * power;
}
async function lift(u, on = true, dur = 160) {
  u.el.classList.toggle('acting', on);
  return tweenCard(u, on ? { s: 1.07, y: u.side === 'hero' ? -16 : 16 } : { s: 1, y: 0 }, dur, ease.outCubic);
}
/** Lunge a fraction of the way toward a target card and come back. */
async function lunge(u, target, k = 0.32, dur = 170, hold = 60) {
  const a = center(u), b = center(target);
  const dx = (b.x - a.x) * k, dy = (b.y - a.y) * k;
  await tweenCard(u, { x: dx, y: dy, r: clamp(dx * 0.02, -6, 6), s: 1.1 }, dur, ease.inCubic);
  return async () => { await wait(hold); await tweenCard(u, { x: 0, y: u.side === 'hero' ? -16 : 16, r: 0, s: 1.07 }, 240, ease.outCubic); };
}

function updateBoard(dt, units) {
  const t = clock.t;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], k = clamp((t - tw.t0) / tw.dur, 0, 1), v = tw.e(k);
    for (const key in tw.to) tw.m[key] = lerp(tw.from[key], tw.to[key], v);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  const dts = dt / 1000;
  for (const u of units) {
    const m = u.m; if (!m || !u.el) continue;
    if (m.flash > 0) m.flash = Math.max(0, m.flash - dt / 220);
    if (m.shake > 0) m.shake = Math.max(0, m.shake - dt / 26);
    const damp = Math.pow(0.0004, dts * 2.2);
    m.kx *= damp; m.ky *= damp; m.kr = (m.kr || 0) * damp;
    const sx = m.shake ? rand(-m.shake, m.shake) : 0, sy = m.shake ? rand(-m.shake, m.shake) * 0.6 : 0;
    const tx = m.x + m.kx + sx, ty = m.y + m.ky + sy;
    u.body.style.transform = `translate3d(${tx.toFixed(1)}px,${ty.toFixed(1)}px,0) rotate(${(m.r + m.kr).toFixed(2)}deg) scale(${m.s.toFixed(3)}) rotateX(${m.rx.toFixed(1)}deg) rotateY(${m.ry.toFixed(1)}deg)`;
    if (m.o !== 1 || u._o !== m.o) { u.body.style.opacity = m.o; u._o = m.o; }
    const ry = ((m.ry % 360) + 360) % 360, back = ry > 90 && ry < 270;
    if (back !== !!u._back) { u.el.classList.toggle('show-back', back); u._back = back; }
    const fl = u.el.querySelector('.c-flash');
    if (m.flash > 0.01 || u._fl) { fl.style.opacity = m.flash.toFixed(3); if (m.flashColor) fl.style.background = m.flashColor; u._fl = m.flash > 0.01; }
    // health bar easing
    u.hpShown += (u.hp - u.hpShown) * Math.min(1, dt / 90);
    u.hpLag += (u.hpShown - u.hpLag) * Math.min(1, dt / 600);
    const hp = u.el.querySelector('.c-hp');
    const pct = clamp(u.hpShown / u.maxHp, 0, 1), lag = clamp(u.hpLag / u.maxHp, 0, 1), sh = clamp((u.barrier || 0) / u.maxHp, 0, 1);
    hp.children[0].style.width = (lag * 100).toFixed(2) + '%';
    hp.children[1].style.width = (pct * 100).toFixed(2) + '%';
    hp.children[2].style.width = (sh * 100).toFixed(2) + '%';
  }
}

/** Gentle tilt toward the pointer while it hovers or presses a card (living-card feel). */
function bindTilt(stageEl, getUnit) {
  let cur = null;
  stageEl.addEventListener('pointermove', e => {
    const c = e.target.closest('.card'); const u = c && getUnit(c.dataset.uid);
    if (cur && cur !== u) { cur.m.rx = 0; cur.m.ry = 0; cur = null; }
    if (!u || !u.alive || u.el.classList.contains('acting')) return;
    const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
    u.m.ry = px * 10; u.m.rx = -py * 10; cur = u;
    c.style.setProperty('--mx', ((px + 0.5) * 100).toFixed(1) + '%'); c.style.setProperty('--my', ((py + 0.5) * 100).toFixed(1) + '%');
  });
  stageEl.addEventListener('pointerleave', () => { if (cur) { cur.m.rx = 0; cur.m.ry = 0; cur = null; } });
}

/** Deal-in animation: card flies in from off-board, spinning from its back to its face. */
async function dealIn(u, delay = 0, fromTop = true) {
  const m = u.m;
  Object.assign(m, { y: fromTop ? -420 : 420, x: rand(-60, 60), r: rand(-25, 25), s: 0.6, o: 0, ry: 180 });
  u.el.classList.add('flipping');
  await wait(delay);
  m.o = 1;
  await tweenCard(u, { y: 0, x: 0, r: 0, s: 1, ry: 0 }, 520, ease.outBack);
  u.el.classList.remove('flipping');
}

// ===== skills.js =====
// Technique choreography on cards. Each technique gets a ctx from battle.js:
// ctx.hit / heal / shield / status / burn / delay / cleanse / revive apply the rules and show feedback.

const C = (u, fy = 0.5) => board.center(u, fy);

function projectile(key, a, b, o = {}) {
  const dur = o.dur ?? 340, arcH = o.arc ?? 40;
  const path = k => { const e = (o.ease || ease.inQuad)(k); return { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e - Math.sin(Math.PI * e) * arcH }; };
  V.fx(key, { w: o.w ?? 180, dur, path, spin: o.spin || 0, rot: o.rot || 0, fadeIn: 0.05, fadeOut: 0.08, ax: o.ax ?? 0.5, flip: o.flip, bloom: o.bloom ?? 0.3 });
  if (o.trail) for (let i = 0; i < 10; i++) wait(i * dur / 10).then(() => { const p = path(i / 10); V.emit(o.trail, p.x, p.y, 3, { color: o.color, speed: [10, 70], life: [250, 550] }); });
  return wait(dur);
}
function frostFx(t) {
  const c = C(t);
  V.fx('ice_burst', { x: c.x, y: c.y, w: 260, dur: 520, s0: 0.6, s1: 1.1 });
  V.emit('shard', c.x, c.y, 10, { color: 'ice', speed: [80, 300] });
  V.floatText('FROST SEAL', c.x, c.y - 70, 'info');
  sfx('ice');
}
async function cut(x) { await ui.cutin(x.u, x.t, x.emp); }
function burstAt(key, u, o = {}) { const c = C(u, o.fy ?? 0.5); return V.fx(key, { x: c.x, y: c.y, w: o.w ?? 300, dur: o.dur ?? 520, s0: o.s0 ?? 0.7, s1: o.s1 ?? 1.15, bloom: 0.3, ...o.extra }); }

};

// ===== battle.js =====
// Battle rules and flow: team turns, cooldown rings, Five Phases, Phase Qi, Harmony chains, Spirit Qi,
// empowering, statuses, boss Qi shield, waves, Fortuitous Encounters, Heavenly Tribulation, enemy AI, auto battle.

const B = {
  units: [], round: 1, side: 'hero', phase: 'idle', busy: false, over: false, result: null, wave: 0,
  qi: RULES.qiStart, gather: 0, points: {}, chain: { len: 0, last: null, list: [] }, maxChain: 0,
  sel: null, emp: false, pendingEnc: null, encounter: null, auto: false, gate: null, tutorial: false, endTurnResolve: null,
  log: { casts: 0 },
};
const listeners = {};
const on = (evt, fn) => { (listeners[evt] || (listeners[evt] = [])).push(fn); return () => { listeners[evt] = listeners[evt].filter(f => f !== fn); }; };
const off = (evt) => { delete listeners[evt]; };
const emit = (evt, data) => (listeners[evt] || []).slice().forEach(f => { try { f(data); } catch (e) { console.error(e); } });

let uidN = 0;
const freshPoints = () => Object.fromEntries([...CYCLE, 'yin'].map(p => [p, 0]));

function makeUnit(d, side, slot, key) {
  return {
    uid: 'u' + (++uidN), key, side, slot, name: d.name, title: d.title, phase: d.phase, art: d.art, lvl: d.lvl, cutin: d.cutin, face: d.face,
    maxHp: d.hp, hp: d.hp, atk: d.atk, defense: d.def, crit: d.crit, critDmg: d.critDmg,
    techs: d.techs.map(t => ({ ...t, cur: t.start ?? 0 })), status: [], barrier: 0, alive: true,
    wide: !!d.wide, boss: !!d.boss, qiShield: d.qiShield ? { max: d.qiShield, cur: d.qiShield } : null,
    attached: [null, null], stats: { dmg: 0, heal: 0 }, d,
  };
}
const getUnit = uid => B.units.find(u => u.uid === uid);
const heroes = () => B.units.filter(u => u.side === 'hero');
const enemies = () => B.units.filter(u => u.side === 'enemy');
const foes = u => B.units.filter(x => x.side !== u.side && x.alive);
const allies = u => B.units.filter(x => x.side === u.side && x.alive);
const has = (u, id) => u.status.find(s => s.id === id);
function advantage(a, d) {
  if (OVER[a] === d) return 1;
  if (OVER[d] === a) return -1;
  return 0;
}

// ======================= setup =======================
async function startBattle(opts = {}) {
  autoRunning = false; ending = false;
  for (const u of B.units) u.el && u.el.remove();
  Object.assign(B, {
    units: [], round: 1, side: 'hero', phase: 'idle', busy: false, over: false, result: null, wave: 0,
    qi: RULES.qiStart, gather: 0, points: { hero: freshPoints(), enemy: freshPoints() },
    chain: { len: 0, last: null, list: [] }, maxChain: 0, sel: null, emp: false, pendingEnc: null, encounter: null,
    tutorial: !!opts.tutorial, log: { casts: 0 },
  });
  HEROES.forEach((d, i) => B.units.push(makeUnit(d, 'hero', i, d.key)));
  for (const u of heroes()) board.createCard(u, ui.boardEl);
  ui.resetBattle();
  for (const [i, u] of heroes().entries()) board.dealIn(u, i * 90, false);
  await wait(500);
  await spawnWave(0);
  emit('ready');
  loop();
}

async function spawnWave(i) {
  B.wave = i;
  const w = WAVES[i];
  for (const u of enemies()) u.el && u.el.remove();
  B.units = B.units.filter(u => u.side === 'hero');
  // lay the wave out centred on the four slots (a boss card is two slots wide)
  const widths = w.enemies.map(k => ENEMIES[k].wide ? 2 : 1), total = widths.reduce((a, b) => a + b, 0);
  let x = (4 - total) / 2;
  w.enemies.forEach((k, j) => { const u = makeUnit(ENEMIES[k], 'enemy', j, k); u.slotX = x; x += widths[j]; B.units.push(u); });
  ui.waveInfo(i, WAVES.length);
  await ui.banner(w.title, w.sub, w.boss ? 'boss' : '');
  const es = enemies();
  es.forEach(u => board.createCard(u, ui.boardEl));
  sfx('whoosh');
  await Promise.all(es.map((u, j) => board.dealIn(u, j * 120, true)));
  if (w.boss) {
    const b = es.find(u => u.boss);
    const c = board.center(b);
    V.shake(14, 420); V.flash('#b98cff', 0.35); sfx('boom');
    V.ring({ x: c.x, y: c.y, r0: 40, r1: 420, color: 'violet', width: 18, dur: 700 });
    V.emit('wisp', c.x, c.y, 26, { color: 'violet', speed: [60, 260], spread: 120, life: [700, 1400] });
    board.hitCard(b, { power: 0.8, color: '#b98cff' });
  }
  ui.refreshAll();
  emit('wave', { index: i, boss: !!w.boss });
}

// ======================= main loop =======================
async function loop() {
  while (!B.over) {
    await heroTurn();
    if (B.over) break;
    await enemyTurn();
    if (B.over) break;
    B.round++;
  }
}

async function heroTurn() {
  B.side = 'hero'; B.phase = 'start'; B.chain = { len: 0, last: null, list: [] };
  board.geo.side = 'hero'; ui.setTurn('hero'); ui.showChain();
  await ui.turnBanner('Your Turn', `Round ${B.round}`, 'hero');
  await startOfTurn('hero');
  if (await checkEnd()) return;
  const gain = RULES.qiBase + heroes().filter(h => h.alive).length * RULES.qiPerHeroine + B.gather * 2;
  B.qi = Math.min(RULES.qiMax, B.qi + gain); ui.qiGain(gain);
  for (const h of heroes()) if (h.alive && h.attached.some(a => a && a.id === 'phase_bead')) addPoints(h, h.phase, 1, true);
  B.encounter = B.round % 2 === 0 ? { offers: rollOffers(), bought: false, rerolls: 0 } : null;
  for (const h of heroes()) markSkip(h);
  B.phase = 'input';
  ui.refreshAll();
  emit('turnStart', { side: 'hero', round: B.round });
  if (B.encounter) emit('encounterReady');
  const done = new Promise(res => { B.endTurnResolve = res; });
  if (B.auto) runAuto();
  await done;
  B.endTurnResolve = null;
  deselect();
  if (B.over) return;
  B.phase = 'end';
  endOfTurn('hero');
  ui.refreshAll();
  emit('turnEnd', { side: 'hero', round: B.round });
}

function markSkip(u) {
  u.skip = !!(has(u, 'frost') || has(u, 'shock'));
}

async function enemyTurn() {
  B.side = 'enemy'; B.phase = 'enemy'; B.chain = { len: 0, last: null, list: [] };
  board.geo.side = 'enemy'; ui.setTurn('enemy'); ui.showChain();
  await ui.turnBanner('Enemy Turn', null, 'enemy');
  await startOfTurn('enemy');
  if (await checkEnd()) return;
  for (const e of enemies()) markSkip(e);
  ui.refreshAll();
  const order = chainOrder(enemies().filter(e => e.alive));
  for (const e of order) {
    if (B.over) return;
    if (!e.alive) continue;
    if (e.skip) {
      const c = board.center(e, 0.42);
      V.floatText(has(e, 'frost') ? 'FROZEN' : 'STUNNED', c.x, c.y, 'info');
      board.hitCard(e, { power: 0.3, color: '#9fd6ff' }); await wait(420); continue;
    }
    const ready = e.techs.filter(t => t.cur <= 0).sort((a, b) => (b.ult ? 9 : b.cd) - (a.ult ? 9 : a.cd));
    for (const t of ready) {
      if (!e.alive || B.over) break;
      const tg = aiTarget(e, t);
      if (!tg) break;
      await doCast(e, t, tg, false);
      await wait(180);
      if (await checkEnd()) return;
    }
  }
  if (B.over) return;
  endOfTurn('enemy');
  ui.refreshAll();
  emit('turnEnd', { side: 'enemy', round: B.round });
  await wait(250);
}

/** Order units so that consecutive phases follow the generating cycle (longest Harmony chains first). */
function chainOrder(units) {
  const left = [...units], out = [];
  while (left.length) {
    let start = left.find(u => !left.some(v => GEN[v.phase] === u.phase && v !== u)) || left[0];
    let cur = start;
    while (cur) {
      out.push(cur); left.splice(left.indexOf(cur), 1);
      cur = left.find(v => v.phase === GEN[cur.phase] && v.phase !== cur.phase);
    }
  }
  return out;
}

// ======================= turn start / end effects =======================
async function startOfTurn(side) {
  for (const u of B.units.filter(x => x.side === side)) { for (const t of u.techs) if (t.cur > 0) t.cur -= 1; board.refreshCard(u); }
  const us = B.units.filter(u => u.side === side && u.alive);
  if (B.round >= RULES.tribulationRound) {
    const pct = RULES.tribulationBase + RULES.tribulationStep * (B.round - RULES.tribulationRound);
    if (side === 'hero' && B.round === RULES.tribulationRound) await ui.banner('Heavenly Tribulation', 'Lightning strikes every card at the start of its turn', 'trib');
    V.flash('#c9b8ff', 0.4); sfx('thunder');
    for (const u of us) {
      const c = board.center(u);
      V.bolt({ x0: c.x + rand(-40, 40), y0: -40, x1: c.x, y1: c.y, color: 'violet', width: 5, dur: 360, branches: 3 });
      V.fx('thunder_burst', { x: c.x, y: c.y, w: 300, dur: 420 });
      const dmg = Math.round(u.maxHp * pct);
      u.hp = Math.max(0, u.hp - dmg);
      V.floatText(dmg.toLocaleString('en-US'), c.x, c.y - 30, side === 'hero' ? 'enemy' : 'dmg', { label: 'TRIBULATION' });
      board.hitCard(u, { power: 0.8, color: '#d9c8ff' });
      if (u.hp <= 0) killUnit(u);
    }
    V.shake(10, 300);
    await wait(650);
  }
  let any = false;
  for (const u of us) {
    if (!u.alive) continue;
    const c = board.center(u);
    for (const s of [...u.status]) {
      if (s.id === 'burn') {
        const dmg = s.value; u.hp = Math.max(0, u.hp - dmg); any = true;
        V.fx('fire_burst', { x: c.x, y: c.y + 30, w: 220, dur: 500 }); V.emit('ember', c.x, c.y + 40, 14, { color: 'fire', speed: [40, 180], spread: 50 });
        V.floatText(dmg.toLocaleString('en-US'), c.x, c.y - 10, side === 'hero' ? 'enemy' : 'dmg', { label: 'FIRE POISON' });
        board.hitCard(u, { power: 0.4, color: '#ff9a6a' });
        if (s.src) s.src.stats.dmg += dmg;
      } else if (s.id === 'venom') {
        const dmg = Math.round(u.maxHp * 0.06); u.hp = Math.max(0, u.hp - dmg); any = true;
        V.emit('glow', c.x, c.y, 12, { color: 'green', speed: [30, 120], spread: 60 });
        V.floatText(dmg.toLocaleString('en-US'), c.x, c.y - 10, side === 'hero' ? 'enemy' : 'dmg', { label: 'GU VENOM' });
        board.hitCard(u, { power: 0.35, color: '#9be36e' });
      } else if (s.id === 'dew' && !has(u, 'wither')) {
        const amt = Math.min(u.maxHp - u.hp, Math.round(u.maxHp * 0.06)); u.hp += amt; any = true;
        V.emit('petal', c.x, c.y, 8, { color: 'jade', speed: [30, 120], spread: 60, up: 60 });
        V.floatText('+' + amt.toLocaleString('en-US'), c.x, c.y - 10, 'heal');
      }
    }
    if (u.hp <= 0) killUnit(u);
  }
  if (any) { sfx('hit'); await wait(600); }
  ui.refreshAll();
}

function endOfTurn(side) {
  for (const u of B.units.filter(x => x.side === side)) {
    for (const s of u.status) s.turns -= 1;
    const expired = u.status.filter(s => s.turns <= 0);
    u.status = u.status.filter(s => s.turns > 0);
    for (const s of expired) {
      if (s.id === 'shield') u.barrier = 0;
      if (s.id === 'shatter' && u.qiShield && u.alive) {
        u.qiShield.cur = u.qiShield.max;
        const c = board.center(u);
        V.ring({ x: c.x, y: c.y, r0: 60, r1: 260, color: 'gold', width: 10, dur: 600 });
        V.floatText('QI SHIELD RESTORED', c.x, c.y - 70, 'info');
      }
    }
    if (u.qiShield && u.alive && !expired.some(x => x.id === 'shatter') && u.qiShield.cur < u.qiShield.max) {
      u.qiShield.cur = u.qiShield.max;
      const c = board.center(u); V.ring({ x: c.x, y: c.y, r0: 60, r1: 240, color: 'gold', width: 8, dur: 520 });
    }
    u.skip = false;
    board.refreshCard(u);
  }
}

// ======================= statuses =======================
function addStatus(u, id, turns, extra = {}) {
  if (!u.alive) return false;
  const d = STATUS[id];
  if (d.debuff && has(u, 'clear')) { const c = board.center(u, 0.4); V.floatText('IMMUNE', c.x, c.y, 'info'); return false; }
  const ex = has(u, id);
  if (ex) { ex.turns = Math.max(ex.turns, turns); if (extra.value) ex.value = Math.max(ex.value || 0, extra.value); if (extra.src) ex.src = extra.src; }
  else u.status.push({ id, turns, ...extra });
  if (id === 'frost' || id === 'shock') { if (B.side === u.side && B.phase === 'input') u.skip = true; }
  board.refreshCard(u);
  return true;
}
function removeStatus(u, id) {
  u.status = u.status.filter(s => s.id !== id);
  if (id === 'shield') u.barrier = 0;
  board.refreshCard(u);
}
function cleanse(u, n = 1) {
  const debuffs = u.status.filter(s => STATUS[s.id].debuff && s.id !== 'shatter');
  debuffs.slice(0, n).forEach(s => removeStatus(u, s.id));
  return Math.min(n, debuffs.length);
}

// ======================= damage & healing =======================
const phaseMul = (side, phase) => 1 + RULES.pointBonus * (B.points[side][phase] || 0);

function computeHit(src, tgt, power, o = {}) {
  const phase = o.phase || src.phase;
  const adv = advantage(phase, tgt.phase);
  let mul = phaseMul(src.side, phase) * (o.hm || 1) * (o.emp ? RULES.empowerMul : 1) * (o.extraMul || 1);
  if (adv > 0) mul *= RULES.advMul; else if (adv < 0) mul *= RULES.resMul;
  if (has(src, 'disrupt')) mul *= 0.7;
  if (has(tgt, 'mark')) mul *= RULES.markMul;
  if (has(tgt, 'shatter')) mul *= RULES.shatterMul;
  if (tgt.attached && tgt.attached.some(a => a && a.id === 'jade_robe')) mul *= 0.8;
  const frost = !o.keepFrost && has(tgt, 'frost');
  if (frost) mul *= RULES.frostBreakMul;
  const critCh = src.crit + (adv > 0 ? RULES.advCrit : 0) + (o.critBonus || 0) + (src.attached && src.attached.some(a => a && a.id === 'sword_insight') ? 0.25 : 0);
  const crit = !o.noCrit && Math.random() < critCh;
  if (crit) mul *= src.critDmg;
  const dmg = Math.max(1, Math.round(src.atk * power / (1 + tgt.defense / RULES.defK) * mul * rand(0.95, 1.05)));
  return { dmg, crit, adv, frost };
}

/** Apply damage (shield first), break Frost Seals, chip Qi shields. Returns the hit record. */
function applyDamage(src, tgt, power, o = {}) {
  if (!tgt.alive) return null;
  const h = computeHit(src, tgt, power, o);
  if (h.frost) removeStatus(tgt, 'frost');
  let absorbed = 0;
  if (tgt.barrier > 0) { absorbed = Math.min(tgt.barrier, h.dmg); tgt.barrier -= absorbed; if (tgt.barrier <= 0) removeStatus(tgt, 'shield'); }
  tgt.hp = Math.max(0, tgt.hp - (h.dmg - absorbed));
  src.stats.dmg += h.dmg;
  h.absorbed = absorbed;
  if (tgt.qiShield && !has(tgt, 'shatter') && tgt.alive) {
    tgt.qiShield.cur = Math.max(0, tgt.qiShield.cur - (h.adv > 0 ? 2 : 1));
    if (tgt.qiShield.cur === 0) { shatter(tgt); h.shattered = true; }
  }
  h.killed = tgt.hp <= 0;
  board.refreshCard(tgt);
  return h;
}

function applyHealAmount(src, tgt, amount) {
  if (!tgt.alive) return 0;
  if (has(tgt, 'wither')) { const c = board.center(tgt, 0.4); V.floatText('WITHERED', c.x, c.y, 'info'); return 0; }
  const amt = Math.round(amount), real = Math.min(tgt.maxHp - tgt.hp, amt);
  tgt.hp += real; src.stats.heal += real;
  board.refreshCard(tgt);
  return amt;
}

function shatter(u) {
  addStatus(u, 'shatter', 1);
  const ult = u.techs.find(t => t.tele); if (ult) ult.cur += 1;
  const c = board.center(u);
  V.flash('#ffe7a8', 0.45); V.shake(12, 380); sfx('shatter'); hitStop(90);
  V.emit('shard', c.x, c.y, 34, { color: 'gold', speed: [240, 820], life: [400, 900] });
  V.ring({ x: c.x, y: c.y, r0: 40, r1: 340, color: 'gold', width: 16, dur: 520 });
  V.floatText('SHATTERED', c.x, c.y - 60, 'big', { label: 'QI SHIELD BROKEN' });
  board.refreshCard(u);
  emit('shatter', u);
}

function killUnit(u) {
  if (!u.alive) return;
  const fi = u.attached ? u.attached.findIndex(a => a && a.id === 'phoenix_feather') : -1;
  if (fi >= 0) {
    u.attached[fi] = null;
    u.hp = Math.round(u.maxHp * 0.4);
    const c = board.center(u);
    V.fx('phoenix', { x: c.x, y: c.y, w: 420, dur: 900, s0: 0.6, s1: 1.1 });
    V.emit('ember', c.x, c.y, 30, { color: 'fire', speed: [80, 300], spread: 60 });
    V.floatText('REBIRTH', c.x, c.y - 40, 'big', { label: 'PHOENIX FEATHER' });
    sfx('heal'); board.refreshCard(u);
    return;
  }
  u.alive = false; u.hp = 0; u.status = []; u.barrier = 0; u.skip = false;
  if (u.side === 'enemy') { B.qi = Math.min(RULES.qiMax, B.qi + RULES.qiPerKill); ui.qiGain(RULES.qiPerKill); }
  board.refreshCard(u);
  ui.killFx(u);
}

// ======================= Phase Qi & Harmony =======================
function chainStep(u) {
  const c = B.chain;
  if (c.last && GEN[c.last] === u.phase && c.last !== u.phase) { c.len += 1; c.list.push(u.phase); }
  else { c.len = 1; c.list = [u.phase]; }
  c.last = u.phase;
  if (u.side === 'hero') B.maxChain = Math.max(B.maxChain, c.len);
  ui.showChain();
  return 1 + RULES.harmonyStep * (c.len - 1);
}
function addPoints(u, phase, n, quiet = false) {
  if (!(phase in B.points[u.side])) return;
  B.points[u.side][phase] += n;
  ui.pointFly(u, phase, n, quiet);
}

// ======================= casting =======================
async function doCast(u, t, target, emp) {
  B.busy = true; ui.lock();
  emit('castStart', { u, t, target });
  if (emp && !(t.emp && B.qi >= t.emp.cost)) emp = false;
  if (emp) { B.qi -= t.emp.cost; ui.qiGain(-t.emp.cost); }
  t.cur = t.cd;
  board.refreshCard(u);
  const hm = chainStep(u);
  const ctx = makeCtx(u, t, target, emp, hm);
  B.log.casts++; B.log[t.id] = (B.log[t.id] || 0) + 1;
  ui.castBanner(u, t, emp, hm);
  await board.lift(u, true);
  try {
    const run = SKILLS[t.id] || SKILLS.claw;
    await run(ctx);
  } catch (e) { console.error('skill error', t.id, e); }
  await board.lift(u, false);
  if (u.alive) addPoints(u, GEN[u.phase], t.ult ? 2 : 1);
  if (B.chain.len >= 2) {
    const c = board.center(u, 0.2);
    V.floatText(`HARMONY ×${B.chain.len}`, c.x, c.y + 6, 'harmony', { label: B.chain.list.map(p => PHASES[p].glyph).join(' → '), size: 34 });
    if (B.chain.len === 4 && u.side === 'hero') {
      B.qi = Math.min(RULES.qiMax, B.qi + 2); ui.qiGain(2);
      ui.harmonyBurst();
    }
  }
  await wait(120);
  B.busy = false;
  ui.refreshAll();
  emit('cast', { u, t, target, emp });
  await checkEnd();
}

function makeCtx(u, t, target, emp, hm) {
  const pos = x => board.center(x);
  return {
    u, t, target, emp, hm, side: u.side, B,
    foes: () => foes(u), allies: () => allies(u), pos,
    /** Damage + feedback (number, shake, sparks). */
    hit(tgt, power, o = {}) {
      if (!tgt || !tgt.alive) return null;
      const h = applyDamage(u, tgt, power, { hm, emp, ...o });
      if (!h) return null;
      const c = board.center(tgt, o.fy ?? 0.45);
      const style = u.side === 'hero' ? (h.crit ? 'crit' : 'dmg') : (h.crit ? 'ecrit' : 'enemy');
      const label = h.adv > 0 ? 'OVERCOME' : (h.adv < 0 ? 'RESISTED' : (h.frost ? 'SEAL BROKEN' : null));
      V.floatText(h.dmg.toLocaleString('en-US'), c.x + rand(-30, 30), c.y + rand(-20, 10), style, { label: h.crit ? null : label, size: o.small ? 30 : undefined });
      if (h.absorbed) V.floatText(`-${h.absorbed.toLocaleString('en-US')}`, c.x + 50, c.y + 40, 'shield', { label: 'SHIELD' });
      board.hitCard(tgt, { power: (o.small ? 0.5 : 1) * (h.crit ? 1.3 : 1), dir: tgt.side === 'enemy' ? -1 : 1, color: o.flash || '#ffffff' });
      const col = o.color || PHASES[o.phase || u.phase].col;
      V.emit('spark', c.x, c.y, h.crit ? 18 : 10, { color: col, speed: [200, 640] });
      if (h.crit) { hitStop(70); V.shake(9, 240); sfx('crit'); } else { sfx('hit'); if (!o.small) V.shake(4, 160); }
      if (h.killed) killUnit(tgt);
      return h;
    },
    heal(tgt, power, o = {}) {
      if (!tgt || !tgt.alive) return 0;
      const amt = u.atk * power * phaseMul(u.side, u.phase) * hm * (emp ? RULES.empowerMul : 1) * rand(0.97, 1.03);
      const real = applyHealAmount(u, tgt, amt);
      if (real) { const c = board.center(tgt, 0.45); V.floatText('+' + real.toLocaleString('en-US'), c.x + rand(-20, 20), c.y, 'heal'); }
      return real;
    },
    shield(tgt, power) {
      if (!tgt || !tgt.alive) return 0;
      const amt = Math.round(u.atk * power * phaseMul(u.side, u.phase) * hm * (emp ? RULES.empowerMul : 1));
      tgt.barrier = Math.max(tgt.barrier, amt);
      addStatus(tgt, 'shield', 2);
      const c = board.center(tgt, 0.45); V.floatText('+' + amt.toLocaleString('en-US'), c.x, c.y + 30, 'shield', { label: 'SPIRIT SHIELD' });
      return amt;
    },
    status: (tgt, id, turns, extra) => addStatus(tgt, id, turns, extra),
    burn(tgt, turns = 2) { return addStatus(tgt, 'burn', turns, { value: Math.round(u.atk * 0.35 * phaseMul(u.side, 'fire') * (emp ? RULES.empowerMul : 1)), src: u }); },
    cleanse: (tgt, n) => cleanse(tgt, n),
    delay(tgt, n = 1) { for (const tt of tgt.techs) if (tt.cd > 1) tt.cur += n; board.refreshCard(tgt); },
    hasStatus: (x, id) => has(x, id),
    revive(tgt, pct) {
      if (tgt.alive) return;
      tgt.alive = true; tgt.hp = Math.round(tgt.maxHp * pct); tgt.status = []; tgt.barrier = 0;
      board.refreshCard(tgt); ui.reviveFx(tgt);
    },
  };
}

// ======================= player input =======================
function canAct(u) { return B.phase === 'input' && !B.busy && !B.over && u.side === 'hero' && u.alive && !u.skip; }
function validTargets(u, t) {
  if (t.target === 'enemy' || t.target === 'allEnemies') return foes(u);
  return allies(u);
}
function selectTech(u, i) {
  const t = u.techs[i];
  if (B.pendingEnc) return;
  if (!canAct(u) || t.cur > 0) { ui.techInfo(u, t); return; }
  if (B.gate && !B.gate('select', { u, t, i })) return;
  if (B.sel && B.sel.u === u && B.sel.i === i) {
    // second tap on a multi-target technique casts it; on a single-target one it keeps the
    // selection, so a double-click never undoes the first click (Cancel or an empty tap deselects)
    if (t.target !== 'enemy') return chooseTarget(validTargets(u, t)[0]);
    return;
  }
  B.sel = { u, t, i }; B.emp = false;
  ui.showSelection();
  emit('selected', { u, t, i });
}
function deselect() { B.sel = null; B.emp = false; ui.showSelection(); }
function toggleEmpower() {
  if (!B.sel || !B.sel.t.emp) return;
  if (!B.emp && B.qi < B.sel.t.emp.cost) return;
  if (B.gate && !B.gate('empower', B.sel)) return;
  B.emp = !B.emp; ui.showSelection();
  emit('empower', { on: B.emp });
}
async function chooseTarget(tgt) {
  if (B.pendingEnc) return applyPendingEncounter(tgt);
  if (!B.sel || !tgt) return;
  const { u, t } = B.sel;
  if (!validTargets(u, t).includes(tgt)) return;
  if (B.gate && !B.gate('target', { u, t, target: tgt })) return;
  const emp = B.emp;
  deselect();
  await doCast(u, t, tgt, emp);
  if (B.auto && B.phase === 'input' && !B.over) runAuto();
}
function endTurn() {
  if (B.phase !== 'input' || B.busy || B.over || !B.endTurnResolve) return;
  if (B.gate && !B.gate('endTurn')) return;
  sfx('click');
  B.phase = 'ending';
  B.endTurnResolve();
}

// ======================= auto battle =======================
let autoRunning = false;
function setAuto(v) {
  B.auto = v; ui.refreshControls();
  if (v && B.phase === 'input' && !B.busy) runAuto();
}
async function runAuto() {
  if (autoRunning) return; autoRunning = true;
  try {
    deselect();
    for (let pass = 0; pass < 4 && B.auto && !B.over && B.phase === 'input'; pass++) {
      const order = chainOrder(heroes().filter(h => h.alive && !h.skip && h.techs.some(t => t.cur <= 0)));
      if (!order.length) break;
      for (const h of order) {
        if (!B.auto || B.over || B.phase !== 'input') return;
        if (!h.alive || h.skip) continue;
        const t = bestTech(h); if (!t) continue;
        const tg = autoTarget(h, t); if (!tg) continue;
        const emp = !!(t.emp && B.qi >= t.emp.cost && (t.ult ? B.qi >= t.emp.cost + 2 : B.qi >= t.emp.cost + 10));
        await doCast(h, t, tg, emp);
        await wait(150);
      }
    }
    if (B.auto && !B.over && B.phase === 'input' && B.encounter && !B.encounter.bought) await autoEncounter();
    if (B.auto && !B.over && B.phase === 'input') { await wait(250); endTurn(); }
  } finally { autoRunning = false; }
}
function bestTech(h) {
  const ready = h.techs.filter(t => t.cur <= 0);
  if (!ready.length) return null;
  const hurt = allies(h).some(a => a.hp / a.maxHp < 0.72 || a.status.some(s => STATUS[s.id].debuff));
  const score = t => (t.ult ? 30 : t.cd * 5) - (t.target === 'allAllies' && t.id === 'su_s2' && !hurt ? 100 : 0);
  return ready.sort((a, b) => score(b) - score(a))[0];
}
function autoTarget(h, t) {
  if (t.target !== 'enemy') return validTargets(h, t)[0];
  const fs = foes(h); if (!fs.length) return null;
  const multi = /mo_s1|ling_s3|su_s1|mo_s3/.test(t.id);
  const sc = f => {
    let s = 0;
    const adv = advantage(h.phase, f.phase);
    s += adv > 0 ? 3 : (adv < 0 ? -2 : 0);
    s += (1 - f.hp / f.maxHp) * 2.5;
    if (f.boss) s += multi && f.qiShield && !has(f, 'shatter') ? 2.5 : 0.5;
    if (computeHit(h, f, 1).dmg > f.hp) s += 2;
    return s + Math.random() * 0.3;
  };
  return fs.sort((a, b) => sc(b) - sc(a))[0];
}
function aiTarget(e, t) {
  const hs = foes(e); if (!hs.length) return null;
  if (t.target !== 'enemy') return hs[0];
  const sc = h => (advantage(e.phase, h.phase) > 0 ? 2 : 0) + (1 - h.hp / h.maxHp) * 1.6 - (h.barrier > 0 ? 0.6 : 0) + Math.random() * 0.8;
  return hs.sort((a, b) => sc(b) - sc(a))[0];
}

// ======================= Fortuitous Encounters =======================
function rollOffers() {
  // later rounds bring rarer finds
  const q = B.round, pLeg = Math.min(0.3, 0.02 + 0.03 * q), pRare = Math.min(0.55, 0.15 + 0.06 * q);
  const out = [];
  let guard = 0;
  while (out.length < 3 && guard++ < 50) {
    const r = Math.random(), rar = r < pLeg ? 3 : (r < pLeg + pRare ? 2 : 1);
    const pool = ENCOUNTERS.filter(e => e.rarity === rar && !out.includes(e));
    if (pool.length) out.push(pick(pool));
  }
  return out;
}
function rerollEncounter() {
  const e = B.encounter; if (!e || e.bought || e.rerolls >= 1 || B.qi < 2) return;
  if (B.gate && !B.gate('reroll')) return;
  B.qi -= 2; ui.qiGain(-2); e.rerolls++; e.offers = rollOffers(); sfx('click'); ui.openShop();
}
async function buyEncounter(i) {
  const e = B.encounter; if (!e || e.bought || B.busy) return;
  const off = e.offers[i]; if (!off || B.qi < off.cost) return;
  if (B.gate && !B.gate('buy', off)) return;
  if (off.target === 'none') {
    e.bought = true; B.qi -= off.cost; ui.qiGain(-off.cost); ui.closeShop();
    await applyEncounter(off, null);
    emit('encounterDone', off);
  } else {
    if (off.attach && !heroes().some(h => h.alive && h.attached.includes(null))) return;
    B.pendingEnc = off; ui.closeShop(); ui.showSelection();
    emit('encounterTarget', off);
  }
}
function cancelPending() { B.pendingEnc = null; ui.showSelection(); }
function encounterTargets(off) {
  if (off.target === 'enemy') return enemies().filter(x => x.alive);
  return heroes().filter(h => h.alive && (!off.attach || h.attached.includes(null)));
}
async function applyPendingEncounter(tgt) {
  const off = B.pendingEnc; if (!off || !tgt || !encounterTargets(off).includes(tgt)) return;
  B.pendingEnc = null; B.encounter.bought = true; B.qi -= off.cost; ui.qiGain(-off.cost); ui.showSelection();
  await applyEncounter(off, tgt);
  emit('encounterDone', off);
}
async function applyEncounter(off, tgt) {
  B.busy = true; ui.lock();
  sfx('charge');
  const strongest = [...heroes()].filter(h => h.alive).sort((a, b) => b.atk - a.atk)[0];
  switch (off.id) {
    case 'thunder_tal': {
      V.flash('#c58bff', 0.3); sfx('thunder');
      for (const f of enemies().filter(x => x.alive)) {
        const c = board.center(f);
        V.bolt({ x0: c.x + rand(-60, 60), y0: -40, x1: c.x, y1: c.y, color: 'violet', width: 5, dur: 380, branches: 3 });
        V.fx('thunder_burst', { x: c.x, y: c.y, w: 320, dur: 460 });
        const h = applyDamage(strongest, f, 0.9, { phase: 'wood', noCrit: true });
        if (h) { V.floatText(h.dmg.toLocaleString('en-US'), c.x, c.y - 20, 'dmg', { label: 'THUNDER TALISMAN' }); board.hitCard(f, { power: 0.9 }); if (h.killed) killUnit(f); }
        await wait(140);
      }
      V.shake(10, 300); break;
    }
    case 'frost_tal': {
      const c = board.center(tgt); sfx('ice');
      V.fx('ice_sigil', { x: c.x, y: c.y, w: 300, dur: 700, back: true }); V.fx('ice_burst', { x: c.x, y: c.y, w: 280, dur: 500 });
      addStatus(tgt, 'frost', 1); V.floatText('FROST SEAL', c.x, c.y - 40, 'info'); board.hitCard(tgt, { power: 0.6, color: '#bfe6ff' }); break;
    }
    case 'qi_pill':
      sfx('heal');
      for (const h of heroes().filter(x => x.alive)) { const c = board.center(h); V.fx('heal_burst', { x: c.x, y: c.y, w: 260, dur: 700 }); const amt = applyHealAmount(h, h, h.maxHp * 0.2); if (amt) V.floatText('+' + amt.toLocaleString('en-US'), c.x, c.y, 'heal'); }
      break;
    case 'gather_array': B.gather += 1; V.floatText('+2 SPIRIT QI EACH TURN', board.geo.W / 2, board.geo.heroY - 20, 'info'); break;
    case 'mark_tal':
      for (const f of enemies().filter(x => x.alive)) { const c = board.center(f); V.fx('curse_sigil', { x: c.x, y: c.y, w: 260, dur: 700, back: true }); addStatus(f, 'mark', 2); }
      break;
    case 'heaven_pill': {
      for (const t of tgt.techs) t.cur = 0;
      const c = board.center(tgt); V.beam({ x: c.x, y: c.y + 150, w: 160, h: 520, color: 'gold', dur: 900 }); V.floatText('ALL TECHNIQUES READY', c.x, c.y - 50, 'info'); sfx('heal');
      break;
    }
    default: { // attachments
      const k = tgt.attached.indexOf(null); if (k >= 0) tgt.attached[k] = off;
      const c = board.center(tgt); V.ring({ x: c.x, y: c.y, r0: 30, r1: 200, color: 'gold', width: 10, dur: 600 });
      V.emit('glow', c.x, c.y, 14, { color: 'gold', speed: [40, 160], spread: 60 });
      V.floatText(off.name.toUpperCase(), c.x, c.y - 40, 'info');
    }
  }
  await wait(450);
  B.busy = false;
  ui.refreshAll();
  await checkEnd();
}
async function autoEncounter() {
  const e = B.encounter;
  const ok = e.offers.map((o, i) => [o, i]).filter(([o]) => B.qi >= o.cost + 2 && (!o.attach || heroes().some(h => h.alive && h.attached.includes(null))));
  if (!ok.length) return;
  const [o, i] = ok.sort((a, b) => b[0].rarity - a[0].rarity)[0];
  await buyEncounter(i);
  if (B.pendingEnc) {
    const ts = encounterTargets(o);
    const tg = o.target === 'enemy' ? ts.sort((a, b) => b.hp - a.hp)[0] : ts.sort((a, b) => b.atk - a.atk)[0];
    await chooseTarget(tg);
  }
}

// ======================= end conditions =======================
let ending = false;
async function checkEnd() {
  if (B.over) return true;
  if (!heroes().some(h => h.alive)) { await finish(false); return true; }
  if (!enemies().some(e => e.alive) && !ending) {
    ending = true;
    try {
      await wait(700);
      if (B.wave + 1 < WAVES.length) {
        deselect(); B.pendingEnc = null;
        await spawnWave(B.wave + 1);
      } else { await finish(true); return true; }
    } finally { ending = false; }
  }
  return false;
}
async function finish(win) {
  if (B.over) return;
  B.over = true; B.result = win ? 'win' : 'lose'; B.phase = 'over';
  deselect();
  if (B.endTurnResolve) B.endTurnResolve();
  await wait(600);
  sfx(win ? 'win' : 'lose');
  if (win) { slowMo(0.4, 500); for (const h of heroes().filter(x => x.alive)) board.lift(h, true, 300); }
  emit(win ? 'victory' : 'defeat');
  ui.result(win);
}

        const u = BT.getUnit(card.dataset.uid);
        if ((BT.B.sel || BT.B.pendingEnc) && card.classList.contains('targetable')) { sfx('click'); BT.chooseTarget(u); return; }
        if (!BT.B.sel && !BT.B.pendingEnc) { if (BT.B.gate && !BT.B.gate('detail', u)) return; this.openDetail(u); return; }

      if (e.target.closest('.tc-cancel')) { if (BT.B.pendingEnc) BT.cancelPending(); else BT.deselect(); return; }

      if (e.target.closest('#shop .reroll')) { BT.rerollEncounter(); return; }
      if (e.target.closest('#shop .leave') || e.target.id === 'shop') { this.closeShop(); return; }
      if (e.target.closest('#detail')) { this.closeDetail(); return; }
      if (e.target.closest('#result .again')) { this.onRestart && this.onRestart(false); return; }
      if (e.target.closest('#result .tut-again')) { this.onRestart && this.onRestart(true); return; }
      if (!e.target.closest('#rp') && !e.target.closest('#lp') && (BT.B.sel)) BT.deselect();

    text: `${W_} Water feeds ${WD} Wood. Casting <b>Mo Yingyue</b> next continues the <b>Harmony chain</b>: +15% per link. Tap her <b>Thunderfang Cross</b>.` },

    text: `${WD} Wood overcomes ${E_} Earth. Strike the <b>Mire Wraith</b>.` },
  { id: 'yan', target: () => techBtn('yan', 0), place: 'above', arrow: true, wait: 'selected', allowEls: () => [techBtn('yan', 0)], allow: (a, p) => a !== 'select' || p.t.id === 'yan_s1',
    text: `${WD} Wood feeds ${F_} Fire: <b>Yan Feihong</b> is next in the chain. Tap her <b>Vermilion Talisman</b>.` },
  { id: 'yan-t', needSel: ['yan', 0], target: () => cardEl(foe('bone')), place: 'below', arrow: true, wait: 'cast', allowEls: () => [cardEl(foe('bone'))], allow: (a, p) => a !== 'target' || p.target.key === 'bone',
    text: `${F_} Fire overcomes ${M_} Metal. Burn the <b>Bone Wraith</b>.` },
  { id: 'su', target: () => techBtn('su', 0), place: 'above', arrow: true, wait: 'selected', allowEls: () => [techBtn('su', 0)], allow: (a, p) => a !== 'select' || p.t.id === 'su_s1',
    text: `${F_} Fire makes ${E_} Earth: close the chain with <b>Su Lianhua</b>. Her <b>Petal Blades</b> also heal the most injured ally.` },
  { id: 'su-t', needSel: ['su', 0], target: () => BT.enemies().filter(e => e.alive).map(cardEl), place: 'below', wait: 'cast', allowEls: () => BT.enemies().map(cardEl),
    text: `Tap any enemy. That makes a <b>Harmony ×4</b>, worth +45% on the last link plus bonus Spirit Qi!` },
  { id: 'points', target: () => $('#pool-hero'), place: 'right', text: `Each technique also adds <b>Phase Qi</b> to the phase it feeds. Every point gives that phase <b>+8%</b> for the rest of the battle, so your chain grows stronger each turn.` },
  { id: 'qi', target: () => $('#qi-box'), place: 'right', text: `<b>Spirit Qi</b> flows in every turn. Spend it to <b>✦ Empower</b> a technique, or on <b>Fortuitous Encounters</b>.` },
  { id: 'mo2', target: () => techBtn('mo', 1), place: 'above', arrow: true, wait: 'selected', allowEls: () => [techBtn('mo', 1)], allow: (a, p) => a !== 'select' || p.t.id === 'mo_s2',
    text: `Mo's <b>Shadow Lightning Step</b> is ready too, and it refreshes her Thunderfang Cross. It starts a new chain, which is fine. Tap it.` },
  { id: 'emp', target: () => $('#techcard .emp-btn'), place: 'left', wait: 'empower', allowEls: () => [$('#techcard .emp-btn')],
    text: `Tap <b>✦ Empower</b>: it spends 6 Spirit Qi for +35% damage and a bonus effect.` },
  { id: 'emp-t', needSel: ['mo', 1, true], target: () => BT.enemies().filter(e => e.alive).map(cardEl), place: 'below', wait: 'cast', allowEls: () => BT.enemies().map(cardEl),
    text: `Empowered! Now tap any enemy.` },

    text: `Thunderfang is ready again: use it if you like. Unused techniques keep their charge. When you are done, tap <b>End Turn</b>.` },
  { id: 'enemy', target: () => BT.enemies().filter(e => e.alive).map(u => u.el.querySelector('.c-techs')), place: 'below', onTurn: 'hero',
    text: `The enemy follows the same rules, Harmony included. Watch the rings on their cards: a <b>1</b> means that technique fires on their next turn.` },
  { id: 'enc', target: () => $('#b-enc'), place: 'left', arrow: true, wait: 'shopOpen', allowEls: () => [$('#b-enc')],
    text: `Even rounds bring a <b>Fortuitous Encounter</b> (奇遇): talismans, pills and treasures for Spirit Qi. Tap it.` },

    text: `Buy one if you can afford it, or leave. Later rounds bring rarer finds.` },
